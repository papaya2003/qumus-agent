# Opt-in stations: the simulated laboratory with the vdW reactor in its own Lab Console
# API (qumus-simlab 8783 under /lab/; Jialei 2026-11-10, no translator). Use it with
#   python -m qumus2 serve --stations qumus2/config/stations.reactor-console.yaml ...
# The reactor tools (qumus2/reactor/tools.py) drive it; it has no record feed.
# Real reactor (after the Olares SSH account, tunnel scripts/reactor_tunnel.sh):
#   reactor: {url: "http://127.0.0.1:18772/lab/", kind: real, adapter: console, session: qumus,
#             microscope_url: "http://127.0.0.1:18770/", allow_actuation: false}
simlab_dir: ../../../qumus-simlab   # relative to this file: the checkout next to qumus-agent
records_from: stacking
modules:
  exfoliation: {url: "http://127.0.0.1:8781/", kind: sim}
  stacking:    {url: "http://127.0.0.1:8782/", kind: sim}
  reactor:     {url: "http://127.0.0.1:8783/lab/", kind: sim, adapter: console, session: qumus}
