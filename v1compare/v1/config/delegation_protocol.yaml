# =============================================================================
# Qumus Agent — Delegation Protocol
# =============================================================================
# This file is the single source of truth for how the Qumus orchestrator
# routes user requests to its managed agents.  It mirrors (and is intended
# to eventually replace) the natural-language rules currently embedded in
# `agents/qumus_agent/qumus_agent.py` (DELEGATION_PROTOCOL, WORKFLOW_PROTOCOLS).
#
# Currently: documentation / reference
# Future:    loaded by a DelegationEngine at runtime
# =============================================================================

# ─────────────────────────── AGENTS ──────────────────────────────────────────

agents:

  lab_manager:
    role: observer                        # read-only — eyes & memory of the lab
    name_in_code: lab_manager_agent
    description: >
      Oversees YOLO CV scans, database chip/flake inventory, and instrument
      status.  Cannot move hardware.
    max_steps: 12
    delegation_style: explicit_sop        # give it step-by-step instructions

    capabilities:
      - yolo_scan                         # live_yolo_capture (left / right / both)
      - scan_materials                    # persist YOLO detections → chip inventory
      - database_query                    # NL → SQL on chip/flake/carrier tables
      - instrument_status                 # read_status & monitor_instrument_status
      - stage_obstruction_check           # check_stage_obstruction (exfoliation stage)
      - tape_readiness_check              # infer from left-camera scan results

    restrictions:
      - read_only: true                   # CANNOT move chips, arms, or hardware
      - no_hardware_actions: true
      - status_checks_never_change_hardware: true
      - cannot_delegate_further: true

    tools:
      - name: live_yolo_capture
        description: >
          Run the live YOLO capture loop on left, right, or both cameras.
        inputs:
          camera_view: { type: string, enum: [left, right, both], default: both }
          max_frames:  { type: integer, default: 10 }
          write_latest: { type: boolean }
          display_window: { type: boolean }

      - name: scan_materials
        description: >
          Load YOLO detections from disk, persist to chip inventory DB, return summary.
        inputs:
          detection_path:   { type: string, nullable: true }
          frame_path:       { type: string, nullable: true }
          process_carriers: { type: boolean, default: true }
          table_side:       { type: string, nullable: true }
          persist:          { type: boolean, default: false }

      - name: query_database
        description: >
          Natural-language query on chip/flake/carrier tables.
          Supports intents: list, count, summary, metric.
        inputs:
          question: { type: string }
          table:    { type: string, enum: [chip, flake, raw_material_carrier, chip_slot, chip_move, chip_detection] }
          intent:   { type: string, enum: [list, count, summary, metric], nullable: true }
          filters:  { type: object, nullable: true }

      - name: check_stage_obstruction
        description: >
          Check DB for chips/carriers on the Exfoliation Stage.
          Returns { stage_status: clear|occupied, obstructing_items: [...] }.
        inputs:
          padding_mm:           { type: number, default: 10.0 }
          refresh_before_query: { type: boolean, default: true }
          detection_path:       { type: string, nullable: true }

      - name: monitor_instrument_status
        description: >
          Poll instrument status on an interval.
        inputs:
          interval_sec: { type: number, default: 1.0 }
          samples:      { type: integer, default: 10 }
          include_cv:   { type: boolean, default: false }
          log:          { type: boolean, default: true }

      - name: read_status
        description: >
          Read current instrument/cv/true_instrument snapshot.
        inputs:
          source: { type: string, enum: [instrument, cv, true_instrument, all], default: all }

  # ─────────────────────────────────────────────────────────────────────────

  processing_agent:
    role: doer                            # physical actor — hands of the lab
    name_in_code: processing_agent
    description: >
      Executes the 2D material processing pipeline: exfoliation, search,
      stacking, and all atomic hardware actions.
    max_steps: 40
    delegation_style: objective_only      # give it the WHAT, not the HOW

    capabilities:
      - exfoliation                       # full exfoliation pipeline
      - chip_movement                     # pick / place / store chips
      - tape_preparation                  # prepare mother tape
      - stage_clearing                    # molecule_clear_stage
      - microscope_search                 # corner detection, auto-search, snake scan
      - system_homing                     # reset / home all
      - stacking                          # transfer stacker workflows

    hardware:
      - robot_arm_left                    # exfoliation side
      - robot_arm_right                   # search / stacking side
      - tape_exfoliator                   # printer
      - exfoliation_vacuum
      - sample_stage_vacuum
      - transfer_stage_vacuum
      - heater
      - power_supply
      - dual_motors
      - sample_stage                      # XY stage for search
      - turret                            # microscope turret
      - focus_motor                       # microscope focus
      - camera                            # UVCHAM microscope camera
      - transfer_controller               # X/Y/Z/goniometer for stacking

    restrictions:
      - no_camera_scans: true             # scanning is lab_manager's job
      - no_database_queries: true
      - no_status_only_requests: true      # status belongs to lab_manager/read_status
      - left_arm_only_for_exfoliation: true
      - right_arm_only_for_search: true
      - stacking_uses_transfer_not_arm: true

    # ── Tool Hierarchy ──────────────────────────────────────────────────
    # Assembly (high-level)  →  Molecule (mid-level)  →  Atom (low-level)
    # Qumus should prefer assembly/molecule; atoms only for explicit moves.
    # ────────────────────────────────────────────────────────────────────

    tools:

      # ASSEMBLY FLOWS  (prefer these)
      assembly:
        - name: assembly_exfoliation
          description: >
            Full exfoliation pipeline.  Optionally prepares mother tape first.
          inputs:
            prepare_mother_tape: { type: boolean, default: true }
            raw_carrier_qr_message: { type: string, nullable: true }
            target_T: { type: number, default: 22.0 }
            hold_V:   { type: number, default: 0.0 }
            dwell_time_s: { type: number, default: 10.0, minimum: 10.0, maximum: 90.0 }
            tape_peel_speed_v: { type: number, default: 500.0, minimum: 50.0, maximum: 500.0 }
            num_massages: { type: integer, default: 1 }
          side: left
          arm: left

        - name: search_chip_assembly
          description: >
            Full search pipeline: 10x snake scan → 100x revisit.
          inputs:
            chip_id: { type: integer, nullable: true }
          side: right
          arm: right

        - name: stacking_workflow
          description: >
            Full stacking/transfer pipeline.
          side: right
          arm: none   # uses transfer controller

      # MOLECULE FLOWS
      molecule:
        # === Exfoliation ===
        - name: molecule_prepare_mother_tape
          description: Prepare crystals on scotch tape (mother tape).
          side: left
          arm: left

        - name: molecule_exfoliate_chip
          description: >
            Exfoliate onto a bare silicon chip.  Only use when tape readiness 
            is already confirmed.
          inputs:
            target_T: { type: number, default: 22.0 }
            hold_V:   { type: number, default: 0.0 }
            dwell_time_s: { type: number, default: 10.0, minimum: 10.0, maximum: 90.0 }
            tape_peel_speed_v: { type: number, default: 500.0, minimum: 50.0, maximum: 500.0 }
            num_massages: { type: integer, default: 1 }
          side: left
          arm: left

        - name: molecule_clear_stage
          description: >
            Intelligently clear the exfoliation stage.  Detects obstructions,
            looks up chip slots, handles DB updates.  The ONLY authorized 
            clearing tool — do NOT use atoms for clearing.
          side: left
          arm: left

        - name: reset_molecule
          description: Home everything / reset system.
          side: both

        # === Search ===
        - name: molecule_corner_detection
          description: Detect chip corners on the microscope stage.
          side: right

        - name: molecule_pickup_chip_to_transfer_stage
          description: Pick up chip from storage and place on transfer/search stage.
          side: right
          arm: right

        - name: molecule_auto_search
          description: Auto-search workflow (snake scan + revisit).
          side: right

        - name: molecule_store_search_silicon_chip
          description: Store a chip from the search stage back to storage.
          side: right
          arm: right

      # ATOM FLOWS (only for explicit pickup/place/move requests)
      atom:

        # -- Left Arm (exfoliation side) --
        exfoliation:
          - atom_left_arm_home
          - atom_left_arm_place_silicon_chip    # place chip ONTO stage
          - atom_left_arm_store_silicon_chip    # pick chip FROM stage back to storage
          - atom_left_arm_place_raw_carrier
          - atom_left_arm_store_raw_carrier
          - atom_left_arm_massage
          - atom_left_arm_rotate_nose
          - atom_left_arm_move_to              # requires explicit mm coordinates
          - atom_left_arm_vacuum_on
          - atom_left_arm_vacuum_off
          - atom_vacuum_on                     # exfoliation stage vacuum
          - atom_vacuum_off

        # -- Right Arm (search/stacking side) --
        search:
          - atom_right_arm_home
          - atom_right_arm_move_to
          - atom_right_arm_place_silicon_chip_on_transfer_stage
          - atom_right_arm_store_search_silicon_chip
          - atom_right_arm_vacuum_on
          - atom_right_arm_vacuum_off
          - atom_transfer_stage_vacuum_on
          - atom_transfer_stage_vacuum_off

        # -- Tape / Printer --
        tape:
          - atom_exfoliator_home
          - atom_exfoliator_power_on
          - atom_exfoliator_power_off
          - atom_tape_apply
          - atom_tape_peel
          - atom_tape_release
          - atom_tape_adjust

        # -- Heater / Temperature --
        heater:
          - atom_heater_on
          - atom_heater_off
          - atom_heater_set
          - atom_read_temperature
          - atom_wait_until_reach_temperature
          - atom_wait_until_drop_temperature

        # -- Sample Stage (search microscope) --
        sample_stage:
          - atom_sample_stage_set_direction
          - atom_sample_stage_set_home
          - atom_sample_stage_set_chip_dims
          - atom_sample_stage_move_to
          - atom_sample_stage_move_relative
          - atom_sample_stage_move_home
          - atom_sample_stage_wait_until_stop

        # -- Camera / Turret / Focus --
        microscope:
          - atom_camera_start
          - atom_camera_stop
          - atom_camera_capture
          - atom_turret_rotate
          - atom_focus_set_zero
          - atom_focus_move_relative

        # -- Observer --
        observer:
          - atom_start_observer
          - atom_stop_observer

        # -- Stacking / Transfer --
        stacking:
          - atom_transfer_connect
          - atom_transfer_disconnect
          - atom_transfer_home_all
          - atom_transfer_home_axis
          - atom_transfer_move_axis_to
          - atom_transfer_move_axis_by
          - atom_transfer_jog_axis
          - atom_transfer_get_positions
          - atom_transfer_set_kst_speed
          - atom_transfer_get_kst_speed
          - atom_transfer_set_pdv_speed
          - atom_transfer_set_pdv_max_speed
          - atom_transfer_stop_pdv

        # -- Utility --
        utility:
          - atom_wait

      # UTILITY TOOLS (always available)
      utility:
        - name: SelectChipPickupPosition
          description: >
            Look up pickup coordinates from inventory for a chip or carrier.
            Must be called BEFORE atomic placement/pickup tools.
          inputs:
            item_type:  { type: string, enum: [bare_silicon_chip, exfoliated_chip, raw_crystal_carrier] }
            arm:        { type: string, enum: [left, right], nullable: true }
            qr_message: { type: string, nullable: true }

        - name: read_status
          description: Read current instrument/cv/true status snapshot.
          inputs:
            source: { type: string, enum: [instrument, cv, true_instrument, all], default: all }

  # ─────────────────────────────────────────────────────────────────────────

  design_agent:
    role: architect                       # theorist — brain of the lab
    name_in_code: design_agent
    description: >
      Expert quantum device design assistant.  Optimizes 2D material
      heterostructures by loading masks, generating constraints, running
      differential-evolution optimization, and exporting results.
    max_steps: 10
    delegation_style: objective_only      # high-level design goal only

    capabilities:
      - device_design
      - layer_optimization
      - mask_processing
      - constraint_generation
      - design_visualization
      - parameter_export

    restrictions:
      - no_hardware_access: true
      - no_database_queries: true
      - no_camera_access: true

    tools:
      - name: load_material_masks
        description: Load 2D material mask images.
      - name: load_and_separate_electrodes
        description: Process electrode mask and separate into individual electrodes.
      - name: generate_design_constraints
        description: Generate geometric constraint rules from NL requirements.
      - name: optimize_design
        description: Run differential-evolution optimization to satisfy constraints.
      - name: visualize_result
        description: Create visualization of optimized design.
      - name: get_violation_details
        description: Check remaining constraint violations.
      - name: export_design_parameters
        description: Save design parameters and transformations to JSON.

    workflow_order:
      - load_material_masks
      - load_and_separate_electrodes
      - generate_design_constraints
      - optimize_design
      - visualize_result
      - get_violation_details
      - export_design_parameters

  # ─────────────────────────────────────────────────────────────────────────

  project_manager:
    role: advisor                         # read-only knowledge advisor
    name_in_code: project_manager
    description: >
      Uses local experiment history to recommend parameters and next-step
      strategy before experiments and after failed rounds.
    max_steps: 8
    delegation_style: objective_only

    capabilities:
      - experiment_history_query
      - failure_pattern_analysis
      - parameter_recommendation

    restrictions:
      - no_hardware_access: true
      - no_inventory_scan: true
      - no_stage_actions: true
      - no_database_queries_on_material_base: true
      - no_online_literature_search: true

    tools:
      - name: query_experiments
        description: >
          Query experiment_base history (run outcomes, parameters, trends).

    rules:
      - "Always query local experiment history first."
      - "Never use online literature search tools."
      - "Consult before experiment execution when parameter selection is needed."
      - "Consult again after a failed round before the next retry."
      - "Return concrete recommendations with explicit confidence."

  # ─────────────────────────────────────────────────────────────────────────

  physics_expert:
    role: knowledge_base                  # NOT a managed agent — it's a tool
    name_in_code: physics_expert
    description: >
      Consults an expert in 2D quantum materials and device fabrication.
      Keeps conversation history.  Used as a direct tool by Qumus, not
      a managed agent.
    is_tool: true                         # exposed as PhysicsExpertTool

    capabilities:
      - materials_science_qa
      - fabrication_advice
      - device_stack_design
      - web_search                        # optional, via use_web flag

    inputs:
      query:             { type: string }
      force_assumptions: { type: boolean, default: false }
      use_web:           { type: boolean, default: false }
      clear_history:     { type: boolean, default: false }


# ─────────────────────── INTENT ROUTING ──────────────────────────────────────

routing_rules:

  # --- Knowledge / planning intents → project_manager ---

  - intent: historical_analysis
    description: Ask what worked before / whether something was tried before
    keywords:
      - what worked before
      - have we tried
      - past experiments
      - experiment history
      - previous runs
      - based on history
    agent: project_manager
    template: project_manager_history
    stop_after: true

  - intent: parameter_recommendation
    description: Ask what parameters should be used next
    keywords:
      - what should we try next
      - recommend parameters
      - best temperature
      - best voltage
      - optimize settings
    agent: project_manager
    template: project_manager_recommendation
    stop_after: true

  # --- Observation / Query intents → lab_manager ---

  - intent: yolo_scan
    description: Camera scan to see what is on the table
    keywords:
      - scan
      - refresh
      - what's on the table
      - run yolo
      - take a picture
    agent: lab_manager
    template: lab_manager_scan
    stop_after: true                      # don't chain into hardware

  - intent: database_query
    description: Query chip/flake/carrier inventory
    keywords:
      - find
      - show me
      - count
      - how many
      - list
      - which chips
      - search database
    agent: lab_manager
    template: lab_manager_query
    stop_after: true

  - intent: status_check
    description: Check instrument or system status
    keywords:
      - status
      - is the vacuum on
      - check if
      - temperature
      - what is the
    agent: lab_manager
    template: lab_manager_status
    read_only: true
    forbidden_agents:
      - processing_agent
    forbidden_actions:
      - heater_on
      - heater_off
      - relay_on
      - relay_off
      - reset
      - cleanup
      - abort
      - home
    stop_after: true

  - intent: stage_check
    description: Check exfoliation stage for obstructions
    keywords:
      - is the stage clear
      - check stage
      - stage obstruction
      - anything on the stage
    agent: lab_manager
    template: lab_manager_stage_check
    camera: left                          # always left for exfoliation stage
    stop_after: true

  - intent: tape_check
    description: Check tape readiness
    keywords:
      - tape status
      - is tape ready
      - scotch tape
      - crystal on tape
    agent: lab_manager
    template: lab_manager_tape_check
    camera: left
    stop_after: true

  # --- Physical action intents → processing_agent ---

  - intent: exfoliation
    description: Full exfoliation workflow
    keywords:
      - exfoliate
      - exfoliation
      - make flakes
      - prepare a chip
    agent: processing_agent
    template: processing_exfoliation
    side: left
    arm: left
    pre_checks:
      - type: scan
        agent: lab_manager
        camera: left
      - type: stage_obstruction
        agent: lab_manager
        camera: left
        on_fail: clear_then_retry         # if occupied, clear stage first
    post_checks:
      - type: verify_scan
        agent: lab_manager
        camera: left
    required_context:
      - tape_status                       # READY | EMPTY | UNKNOWN

  - intent: prepare_tape
    description: Prepare mother tape (scotch tape with crystals)
    keywords:
      - prepare tape
      - mother tape
      - prepare crystals on scotch tape
    agent: processing_agent
    template: processing_tape
    side: left
    arm: left

  - intent: clear_stage
    description: Clear the exfoliation stage
    keywords:
      - clear stage
      - clear the stage
      - remove from stage
      - clean stage
    agent: processing_agent
    template: processing_clear
    side: left
    arm: left
    pre_checks:
      - type: scan
        agent: lab_manager
        camera: left

  - intent: chip_move
    description: Atomic chip pickup/place/move
    keywords:
      - pickup
      - pick up
      - move chip
      - place chip
      - store chip
      - home arm
    agent: processing_agent
    template: processing_move
    # side and arm determined by context

  - intent: search
    description: Microscope search for flakes on a chip
    keywords:
      - search
      - scan for flakes
      - run search
      - search chip
      - corner detection
      - snake scan
      - revisit
    agent: processing_agent
    template: processing_search
    side: right
    arm: right
    default_flow: search_chip_assembly    # 10x scan → 100x revisit

  - intent: stacking
    description: Transfer/stacking workflow
    keywords:
      - stack
      - transfer
      - build device
      - align
    agent: processing_agent
    template: processing_stacking
    side: right
    arm: none                             # uses transfer controller

  - intent: system_reset
    description: Home / reset all hardware
    keywords:
      - home
      - reset
      - home everything
    agent: processing_agent
    template: processing_reset

  # --- Design intents → design_agent ---

  - intent: device_design
    description: Design a quantum device
    keywords:
      - design
      - create device
      - hall bar
      - heterostructure
      - optimize design
      - device layout
    agent: design_agent
    template: design_task
    stop_after: true

  # --- Knowledge intents → physics_expert (tool) ---

  - intent: physics_question
    description: Ask a physics / materials science question
    keywords:
      - what is
      - explain
      - how does
      - why does
      - physics of
      - band structure
    agent: physics_expert
    is_tool_call: true                    # not a managed agent delegation
    stop_after: true


# ─────────────────── CAMERA / SIDE ROUTING ───────────────────────────────────

camera_routing:

  left_camera:
    camera_index: 0
    workflows:
      - exfoliation
      - prepare_tape
      - clear_stage
    detectable_objects:
      - raw_material_carrier
      - bare_silicon_chip
      - exfoliation_stage
      - scotch_tape_crystal
    stages:
      - exfoliation_stage
    arm: left

  right_camera:
    camera_index: 1
    workflows:
      - search
      - stacking
    detectable_objects:
      - exfoliated_chip
      - stamp
      - search_stage
      - transfer_stage
      - device
    stages:
      - search_stage
      - transfer_stage
      - chip_storage
    arm: right

  # Disambiguation rules
  disambiguation:
    - trigger: "user mentions 'right side' or 'right table' or 'right arm'"
      default_to: right_camera
      exception: "unless explicitly asking about exfoliation stage"
    - trigger: "user asks about exfoliated chip storage"
      default_to: right_camera
      reason: "exfoliated chips are stored on the right table"


# ─────────────── ARM ROUTING (HARD CONSTRAINTS) ─────────────────────────────

arm_routing:

  left_arm:
    allowed_workflows:
      - exfoliation
      - prepare_tape
      - clear_stage
    allowed_objects:
      - bare_silicon_chip
      - raw_material_carrier
    side: left
    on_wrong_arm_request: ask_clarification   # never silently switch

  right_arm:
    allowed_workflows:
      - search
    allowed_objects:
      - exfoliated_chip
    side: right
    on_wrong_arm_request: ask_clarification

  transfer_controller:
    allowed_workflows:
      - stacking
    note: "No robot arm — uses transfer stacker (X/Y/Z/goni)"


# ─────────────────── DELEGATION TEMPLATES ────────────────────────────────────

templates:

  # --- Lab Manager templates ---

  lab_manager_scan:
    format: |
      LAB MANAGER REQUEST
      Task Summary: {task_summary}
      Camera View: {camera_view}
      Action Checklist:
      1. live_yolo_capture(camera_view="{camera_view}")
      2. scan_materials(persist=True, table_side="{table_side}")
      Deliverable: Detection summary with image paths

  lab_manager_query:
    format: |
      LAB MANAGER REQUEST
      Task Summary: {task_summary}
      Required Data: {data_requirements}
      Action Checklist:
      1. query_database(question="{question}", table="{table}")
      Deliverable: {expected_output}

  lab_manager_status:
    format: |
      LAB MANAGER REQUEST
      Task Summary: Check {status_item}
      Action Checklist:
      1. read_status(source="{source}")
      Deliverable: Current status report

  lab_manager_stage_check:
    format: |
      LAB MANAGER REQUEST
      Task Summary: Check exfoliation stage for obstructions
      Action Checklist:
      1. live_yolo_capture(camera_view="left")
      2. scan_materials(persist=True, table_side="left")
      3. check_stage_obstruction(refresh_before_query=True)
      Deliverable: Stage status (clear / occupied) with obstruction details

  lab_manager_tape_check:
    format: |
      LAB MANAGER REQUEST
      Task Summary: Check tape readiness for exfoliation
      Action Checklist:
      1. live_yolo_capture(camera_view="left")
      2. Inspect summary for "scotch tape crystal"
      Deliverable: "TAPE STATUS: READY" or "TAPE STATUS: EMPTY"

  # --- Processing Agent templates ---

  processing_exfoliation:
    format: |
      Exfoliate onto a bare silicon chip.
      TAPE STATUS: {tape_status}
      Parameters: target_T={target_T} C, hold_V={hold_V} V, dwell_time_s={dwell_time_s} s, tape_peel_speed_v={tape_peel_speed_v}, num_massages={num_massages}
    defaults:
      tape_status: UNKNOWN
      target_T: 22.0
      hold_V: 0.0
      dwell_time_s: 10.0
      tape_peel_speed_v: 500.0
      num_massages: 1
    notes:
      - "If TAPE STATUS is READY → processing_agent uses molecule_exfoliate_chip"
      - "If TAPE STATUS is EMPTY/UNKNOWN → processing_agent uses assembly_exfoliation(prepare_mother_tape=True)"
      - "Approved (target_T, hold_V) pairs: (22,0), (30,6.5), (50,10), (70,13.5), (90,17)."
      - "If material is specified (e.g. 'Graphene' or 'graphite'), pass raw_carrier_qr_message='Gr'. `Gr` means graphite; graphene means Gr + monolayer/thickness=1."

  processing_tape:
    format: |
      Prepare mother tape (scotch tape with crystals).

  processing_clear:
    format: |
      Clear the exfoliation stage.
    notes:
      - "Always delegate high-level intent, NOT atomic steps"
      - "Processing agent will use molecule_clear_stage internally"

  processing_move:
    format: |
      {task_objective}
    notes:
      - "Use SelectChipPickupPosition before atomic placement tools"
      - "Never fabricate coordinates — if unknown, let processing_agent handle"
      - "Only include chip_id if user explicitly named it"

  processing_search:
    format: |
      Search chip {chip_identifier} for {material_type} flakes using {search_flow}.
      Pass material_type={material_type_code}.
    defaults:
      search_flow: search_chip_assembly
    notes:
      - "Default flow: search_chip_assembly (10x scan → 100x revisit)"
      - "Pass material_type whenever known; use Gr for graphene/graphite and hBN for hBN so the live segmenter uses the correct material model."
      - "If chip_id is unknown, omit chip_id instead of using a placeholder, but still pass material_type when the target material is known."
      - "Specific flows: molecule_corner_detection, molecule_auto_search"

  processing_stacking:
    format: |
      {task_objective}

  processing_reset:
    format: |
      Home everything / Reset system.

  # --- Design Agent template ---

  design_task:
    format: |
      DESIGN REQUEST
      Goal: {design_goal}
      Materials: {materials}
      Constraints: {constraints}


# ──────────────── ORCHESTRATION WORKFLOWS (GATES) ────────────────────────────

orchestration:

  material_acquisition_gate:
    description: >
      Single entry point for "I need material X" requests.
    steps:
      - query: "SELECT * FROM flake WHERE type_label = '{type_label}'"
        on_found: report_and_stop
      - query: "SELECT * FROM chip WHERE is_searched = 0"
        on_found: delegate_search_to_processing_agent
      - fallback: delegate_exfoliation_to_processing_agent

  pre_action_gate:
    description: >
      MANDATORY before any processing_agent hardware action.
      Skip for scan-only or design-only requests.
    applies_to:
      - exfoliation
      - search
      - stacking
      - chip_move
      - clear_stage
    steps:
      - name: initial_scan
        agent: lab_manager
        action: live_yolo_capture + scan_materials
        camera: "determined by workflow side"

      - name: exfoliation_specific_check
        condition: "workflow == exfoliation"
        agent: lab_manager
        action: check_stage_obstruction
        on_occupied:
          - delegate: processing_agent
            task: molecule_clear_stage
          - retry: initial_scan

  post_action_verification:
    description: >
      MANDATORY after any processing_agent task.
    steps:
      - name: verify_scan
        agent: lab_manager
        action: live_yolo_capture + scan_materials
        camera: "same side as the action"
      - on_unexpected: report_and_stop

  interactive_confirmation:
    description: >
      For new hardware actions, broadcast plan and ask user to confirm.
    rules:
      - "If prior plan proposed and user says 'Proceed/Yes' → execute immediately"
      - "New hardware actions → broadcast plan, ask for 'Confirm'"
      - "Exempt: scan-only, design-only requests"

  state_continuity:
    description: >
      If chat history conflicts with current lab state, run a scan to
      re-establish baseline before any hardware action.


# ──────────────── CRITICAL RULES (HARD CONSTRAINTS) ─────────────────────────

hard_rules:

  anti_loop:
    description: >
      If qumus_agent has already broadcast a plan, the very next action
      MUST be delegation to an agent.  Max 3 consecutive plan broadcasts
      before forced delegation.
    max_consecutive_plans: 3
    enforced_by: GuardedBroadcastWorkflowPlanTool

  no_intent_mixing:
    description: >
      Scan-only or design-only requests should NOT chain into hardware
      actions.  Keep intents separate.

  delegate_objectives_not_methods:
    description: >
      For processing_agent, describe WHAT you want done, not HOW.
      Exception: lab_manager gets explicit SOPs because it's an observer.

  pose_discipline:
    description: >
      Never fabricate chip coordinates.  If unknown, delegate to a 
      higher-level flow that handles lookups.  Only include chip_id 
      or slot if the user explicitly named it.

  tape_status_handoff:
    description: >
      When delegating exfoliation, MUST include TAPE STATUS based on 
      latest lab_manager scan.
    values: [READY, EMPTY, UNKNOWN]
    logic:
      READY: molecule_exfoliate_chip
      EMPTY: assembly_exfoliation(prepare_mother_tape=True)
      UNKNOWN: assembly_exfoliation(prepare_mother_tape=True)

  temperature_defaults:
    description: >
      Propagate user-specified values. `(target_T, hold_V)` must follow approved
      pairs: (22,0), (30,6.5), (50,10), (70,13.5), (90,17).
      If `hold_V` is omitted, use the matched pair value. Otherwise use defaults.
      Parameter meanings: target_T (C) = stage temperature setpoint for heating;
      hold_V (V) = heater hold voltage after reaching target_T; dwell_time_s (s) = soak duration
      (allowed 10 to 90)
      before peel; tape_peel_speed_v (G-code F) = peel feedrate (allowed 50 to 500); num_massages (count) = massage
      stroke rounds per row before heating/peel.
      Safety note: use approved `(target_T, hold_V)` pairs to avoid unstable heating behavior.
    defaults:
      target_T: 22.0   # Celsius
      hold_V: 0.0      # Volts
      dwell_time_s: 10.0
      tape_peel_speed_v: 500.0
      num_massages: 1

  search_stage_placement:
    description: >
      Default coordinates for placing chip on search stage.
    defaults:
      x_mm: -20
      y_mm: 300
      z_mm: 130
      safe_z_mm: 140
      pickup_z_mm: 15

  raw_carriers_left_only:
    description: >
      Raw material carriers are LEFT-SIDE only.
      Do NOT use right-arm tools for carriers.

  identity_shortcut:
    description: >
      If user asks "who are you" / "what can you do", answer directly 
      in 1–3 sentences.  Do NOT broadcast a plan or delegate.
