# Default stations: the simulated laboratory (qumus-simlab) on this computer.
# Copy to ./stations.yaml (or pass --stations / QUMUS_STATIONS) to change a module,
# e.g. point stacking at the lab PC through an SSH tunnel with kind: real.
simlab_dir: ../qumus-simlab        # relative to this file
records_from: stacking
modules:
  exfoliation: {url: "http://127.0.0.1:8781/", kind: sim}
  stacking:    {url: "http://127.0.0.1:8782/", kind: sim}
  reactor:     {url: "http://127.0.0.1:8783/", kind: sim}

# Same computer or another computer: only the URL changes, the protocol is the same.
#   same computer:            url: "http://127.0.0.1:8782/"
#   another computer, LAN:    url: "http://192.168.1.20:8782/"   (station started with --host 0.0.0.0)
#   another computer, SSH:    ssh -N -L 18782:127.0.0.1:18782 user@labpc   then
#                             url: "http://127.0.0.1:18782/"      (the station's remote-only port)
# The launcher only starts qumus-simlab for stations on this computer (loopback URLs).
